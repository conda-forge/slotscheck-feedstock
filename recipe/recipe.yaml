schema_version: 1

context:
  name: slotscheck
  version: "0.20.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/slotscheck-${{ version }}.tar.gz
  sha256: f590fddcea4b673f6ef3ee0010a545df1cad96941ef09906b28b2ee31c38c66b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - slotscheck = slotscheck.cli:root

requirements:
  host:
    - poetry-core >=1.9.0
    - pip
    - python ${{ python_min }}.*
  run:
    - click >=8.0.0,<9.0.0
    - python >=${{ python_min }}
    - tomli >=0.2.6,<3.0.0

tests:
  - python:
      imports:
        - slotscheck
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - slotscheck --help

about:
  summary: Validate your __slots__
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ariebovenberg/slotscheck
  documentation: https://slotscheck.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan
