schema_version: 1

context:
  name: slotscheck
  version: "0.21.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/slotscheck-${{ version }}.tar.gz
  sha256: 0a5296300c5d5d9663e597861d7b3ef16abc74c851498a648116d868960c12c2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - slotscheck = slotscheck.cli:root

requirements:
  host:
    - uv-build >=0.11.22,<0.12
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - tomli >=0.2.6,<3.0.0

tests:
  - python:
      imports:
        - slotscheck
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - slotscheck --help

about:
  summary: Validate your __slots__
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ariebovenberg/slotscheck
  documentation: https://slotscheck.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - thewchan
